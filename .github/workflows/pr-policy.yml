name: PR policy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-description:
    name: Validate PR title and description
    runs-on: ubuntu-latest
    steps:
      - name: Check required PR information
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const titlePattern = /^\[T-\d{8}-\d{2}\]\s+\S/;
            const errors = [];

            if (!titlePattern.test(pr.title)) {
              errors.push('PR 标题必须采用 `[T-YYYYMMDD-NN] 简要说明` 格式。');
            }

            const body = pr.body || '';
            const requiredSections = [
              '关联任务',
              '测试内容',
              '测试结果',
              '测试代码',
              '测试原始数据链接'
            ];

            function sectionContent(heading) {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const pattern = new RegExp(
                `^##[ \\t]+${escaped}[ \\t]*\\r?\\n([\\s\\S]*?)(?=^##[ \\t]+|(?![\\s\\S]))`,
                'mi'
              );
              const match = body.match(pattern);
              if (!match) return '';
              return match[1]
                .replace(/<!--[\s\S]*?-->/g, '')
                .trim();
            }

            for (const heading of requiredSections) {
              if (!sectionContent(heading)) {
                errors.push(`“${heading}”章节不能为空。`);
              }
            }

            const task = sectionContent('关联任务');
            if (task && !/T-\d{8}-\d{2}/.test(task)) {
              errors.push('“关联任务”必须包含 T-YYYYMMDD-NN 格式的任务编号。');
            }

            const rawData = sectionContent('测试原始数据链接');
            const hasUrl = /https:\/\/\S+/i.test(rawData);
            const hasReasonedNA = /不适用\s*[：:]\s*\S+/.test(rawData);
            if (rawData && !hasUrl && !hasReasonedNA) {
              errors.push('“测试原始数据链接”必须包含 https:// 链接，或按“不适用：原因”说明。');
            }

            const unchecked = (body.match(/^- \[ \]/gm) || []).length;
            if (unchecked > 0) {
              errors.push(`提交前检查仍有 ${unchecked} 项未勾选。`);
            }

            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            }
