name: Audit direct main updates

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: Verify direct push scope
    runs-on: ubuntu-latest
    steps:
      - name: Check task-publication exception
        uses: actions/github-script@v7
        with:
          script: |
            const payload = context.payload;
            const allZeros = /^0+$/.test(payload.before);

            if (allZeros) {
              core.notice('Initial main publication; no prior commit exists.');
              return;
            }

            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: payload.after
            });

            const mergedToMain = associated.data.some(
              pr => pr.base.ref === 'main' && pr.merged_at
            );

            if (mergedToMain) {
              core.notice('The main update is associated with a merged PR.');
              return;
            }

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: `${payload.before}...${payload.after}`
            });
            const files = comparison.data.files || [];
            const allowedPath = '测试安排.md';
            const validTaskPublication =
              context.actor === 'MMurphy98' &&
              files.length === 1 &&
              files[0].filename === allowedPath &&
              files[0].status === 'modified';

            if (!validTaskPublication) {
              const changed = files.map(file => file.filename).join(', ') || '<none>';
              core.setFailed(
                'A direct main update may only be made by @MMurphy98 and may only ' +
                `modify ${allowedPath}. Changed files: ${changed}`
              );
              return;
            }

            core.notice('Direct task publication conforms to the allowed exception.');
